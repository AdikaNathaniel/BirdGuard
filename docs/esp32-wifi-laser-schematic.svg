<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .box { fill:#f8f9fa; stroke:#2b2f33; stroke-width:2; rx:6; }
    .cloud { fill:#eaf2ff; stroke:#2b6cff; stroke-width:2; opacity:0.95; }
    .wire { stroke:#222; stroke-width:3; fill:none; stroke-linecap:round; }
    .thin { stroke-width:1.5; }
    .label { font-family:Arial, Helvetica, sans-serif; font-size:14px; fill:#111; }
    .title { font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; fill:#0b3b9b; }
    .comp { font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#000; }
    .note { font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#333; }
    .pin { font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#fff; }
    .dashed { stroke-dasharray:6 6; }
    .ground { stroke:#000; stroke-width:2; }
  </style>

  <!-- Title -->
  <text x="24" y="28" class="title">ESP32 (Wi‑Fi) → MOSFET low‑side switch for 12 V laser</text>

  <!-- Raspberry Pi -->
  <g transform="translate(40,60)">
    <rect class="box" x="0" y="0" width="220" height="140" rx="8" />
    <text x="16" y="28" class="comp">Raspberry Pi</text>
    <text x="16" y="52" class="note">Runs detection model</text>
    <text x="16" y="72" class="note">Send HTTP/MQTT to ESP32</text>
    <circle cx="180" cy="110" r="6" fill="#2b6cff" />
    <text x="16" y="104" class="note">Wi‑Fi</text>
  </g>

  <!-- Wi-Fi cloud -->
  <g transform="translate(300,40)">
    <ellipse class="cloud" cx="120" cy="40" rx="120" ry="40"/>
    <text x="68" y="45" class="comp">Wi‑Fi Network</text>
    <line class="wire thin" x1="260" y1="40" x2="340" y2="120" />
    <line class="wire thin" x1="260" y1="40" x2="160" y2="120" />
    <line class="wire thin" x1="160" y1="120" x2="260" y2="120" />
  </g>

  <!-- ESP32 -->
  <g transform="translate(420,120)">
    <rect class="box" x="0" y="0" width="300" height="220" rx="8" />
    <text x="18" y="26" class="comp">ESP32 Dev Board (Wi‑Fi)</text>
    <text x="18" y="48" class="note">Power from USB / 5V regulator → 3.3V on board</text>

    <!-- pins -->
    <rect x="18" y="72" width="120" height="30" rx="4" fill="#2b6cff" />
    <text x="26" y="92" class="pin">GPIO16 (LASER_CTRL)</text>

    <rect x="18" y="110" width="80" height="24" rx="4" fill="#666" />
    <text x="26" y="127" class="pin">GND</text>

    <rect x="18" y="146" width="80" height="24" rx="4" fill="#2b6cff" />
    <text x="26" y="163" class="pin">3V3</text>
  </g>

  <!-- Wire from Wi-Fi to ESP32 -->
  <line class="wire thin" x1="330" y1="120" x2="420" y2="180" />
  <text x="335" y="140" class="note">HTTP / MQTT</text>

  <!-- Gate resistor and pulldown -->
  <g transform="translate(540,188)">
    <!-- GPIO line -->
    <line class="wire" x1="-220" y1="-16" x2="-40" y2="-16" />
    <!-- resistor -->
    <rect x="-40" y="-26" width="80" height="20" fill="#fff" stroke="#a65" stroke-width="2" rx="2"/>
    <text x="-12" y="-12" class="comp">100Ω</text>
    <!-- wire to gate -->
    <line class="wire" x1="40" y1="-6" x2="160" y2="-6" />
    <text x="44" y="-16" class="note">Gate</text>
  </g>

  <!-- MOSFET symbol -->
  <g transform="translate(720,240)">
    <!-- body -->
    <rect x="-40" y="-30" width="120" height="140" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
    <!-- labels -->
    <text x="0" y="-10" class="comp">N‑Channel MOSFET</text>
    <text x="-20" y="8" class="note">D (Drain)</text>
    <text x="-20" y="88" class="note">S (Source)</text>
    <text x="60" y="40" class="note">G (Gate)</text>

    <!-- drain line up -->
    <line class="wire" x1="0" y1="10" x2="0" y2="-50" />
    <circle cx="0" cy="-56" r="6" fill="#000" />
    <text x="-72" y="-58" class="note">Laser GND → MOSFET D</text>

    <!-- source line down -->
    <line class="wire" x1="0" y1="70" x2="0" y2="130" />
    <circle cx="0" cy="136" r="6" fill="#000" />
    <text x="-56" y="152" class="note">MOSFET S → Common GND</text>

    <!-- gate connection -->
    <line class="wire" x1="-28" y1="26" x2="-120" y2="-6" />
    <text x="-112" y="32" class="note">100kΩ pulldown</text>
    <!-- pulldown resistor -->
    <rect x="-140" y="36" width="64" height="18" fill="#fff" stroke="#a65" stroke-width="2" rx="2"/>
    <text x="-136" y="50" class="comp">100kΩ</text>
  </g>

  <!-- Laser -->
  <g transform="translate(720,60)">
    <rect x="-12" y="0" width="220" height="80" rx="8" fill="#fff" stroke="#2b2f33" stroke-width="2"/>
    <text x="10" y="22" class="comp">12 V Laser Module</text>
    <text x="10" y="42" class="note">Verify built‑in current regulator</text>

    <!-- Laser V+ -->
    <line class="wire" x1="0" y1="40" x2="-240" y2="40" />
    <text x="-120" y="28" class="note">Laser V+</text>
    <text x="-120" y="52" class="note">→ Fuse → +12V supply</text>

    <!-- Laser GND connection to MOSFET drain -->
    <line class="wire" x1="208" y1="40" x2="380" y2="120" />
    <line class="wire" x1="380" y1="120" x2="380" y2="220" />
    <text x="332" y="96" class="note">Laser GND → MOSFET D</text>
  </g>

  <!-- +12V supply and fuse -->
  <g transform="translate(240,380)">
    <rect class="box" x="0" y="0" width="260" height="120" rx="8" />
    <text x="16" y="26" class="comp">12 V Power Supply</text>
    <text x="16" y="48" class="note">Rated for laser current + margin</text>

    <!-- +12V out -->
    <line class="wire" x1="240" y1="36" x2="420" y2="100" />
    <text x="310" y="62" class="note">+12V</text>

    <!-- fuse symbol inline on +12V -->
    <g transform="translate(420,92)">
      <rect x="-28" y="-20" width="56" height="20" fill="#fff" stroke="#aa0000" stroke-width="2" rx="4"/>
      <text x="-20" y="-6" class="comp">FUSE</text>
    </g>

    <!-- TVS across +12 and GND -->
    <line class="wire dashed" x1="100" y1="80" x2="100" y2="130" />
    <text x="110" y="105" class="note">Optional TVS across +12V & GND</text>
  </g>

  <!-- ground rail and notes -->
  <g transform="translate(40,540)">
    <line class="ground" x1="0" y1="10" x2="1100" y2="10" />
    <text x="16" y="36" class="note">Common ground: tie ESP32 GND, MOSFET S, and 12 V supply negative together</text>
    <text x="16" y="56" class="note">Use inline fuse on +12 V and choose MOSFET with low Rds(on) at Vgs = 3.3 V</text>
    <text x="16" y="76" class="note">Implement auto‑off timeout on ESP32 and avoid boot‑strap pins</text>
  </g>

  <!-- Legend -->
  <g transform="translate(880,420)">
    <rect x="0" y="0" width="300" height="180" rx="6" fill="#fff" stroke="#ccc" />
    <text x="12" y="22" class="comp">Legend / Key</text>
    <text x="12" y="46" class="note">• Gate resistor: 100–220 Ω</text>
    <text x="12" y="66" class="note">• Gate pulldown: 100 kΩ</text>
    <text x="12" y="86" class="note">• MOSFET: Vds ≥ 30 V, low Rds(on) @ 3.3 V</text>
    <text x="12" y="106" class="note">• Fuse: rated slightly above normal current</text>
    <text x="12" y="126" class="note">• TVS: optional for transient protection</text>
    <text x="12" y="146" class="note">• For PWM use ESP32 LEDC, confirm laser accepts PWM</text>
  </g>
</svg>
